<text x="124" y="218" class="eyebrow" >BROWSER</text>
<text x="64" y="273" class="name" >Code editor</text>
<text x="64" y="306" class="body" >Write code. Talk.</text>
<text x="64" y="344" class="small" >Keeps editor state</text>
<rect x="368" y="172" width="224" height="198" rx="16" fill="#ffffff" stroke="#dbe6df" filter="url(#shadow)"/>
<rect x="388" y="190" width="48" height="48" rx="12" fill="#edf5ef" stroke="none" />
<g transform="translate(394 196) scale(1)" fill="none" stroke="#22644d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="28" height="12" rx="4"/><rect x="4" y="21" width="28" height="12" rx="4"/><path d="M10 9h1m5 0h10M10 27h1m5 0h10M18 15v6"/></g>
<text x="448" y="218" class="eyebrow" >CONNECTION</text>
<text x="388" y="273" class="name" >LiveKit server</text>
<text x="388" y="306" class="body" >Passes audio + code</text>
<text x="388" y="344" class="small" >Connects both sides</text>
<rect x="692" y="172" width="224" height="198" rx="16" fill="#ffffff" stroke="#dbe6df" filter="url(#shadow)"/>
<rect x="712" y="190" width="48" height="48" rx="12" fill="#edf5ef" stroke="none" />
<g transform="translate(718 196) scale(1)" fill="none" stroke="#22644d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5h20a5 5 0 0 1 5 5v14a5 5 0 0 1-5 5H15l-8 5v-6a5 5 0 0 1-4-5V10a5 5 0 0 1 5-5Z"/><path d="m18 10 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/></g>
<text x="772" y="218" class="eyebrow" >AGENT</text>
<text x="712" y="273" class="name" >Node.js agent</text>
<text x="712" y="306" class="body" >Reads code + words</text>
<text x="712" y="344" class="small" >Builds the reply</text>
