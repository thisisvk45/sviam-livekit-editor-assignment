<text x="32" y="84" class="subtitle" >Your code and conversation, connected.</text>
<rect x="737" y="28" width="191" height="36" rx="18" fill="#eff6f2" stroke="none" />
<text x="832.5" y="52" class="chip" text-anchor="middle">No deployment</text>
<rect x="24" y="112" width="912" height="350" rx="18" fill="#f2f7f4" stroke="#d5e3da" />
<text x="44" y="146" class="eyebrow" >ON YOUR LAPTOP</text>
<text x="916" y="146" class="small" text-anchor="end">Provided in the starter</text>
<rect x="44" y="172" width="224" height="198" rx="16" fill="#ffffff" stroke="#dbe6df" filter="url(#shadow)"/>
<rect x="64" y="190" width="48" height="48" rx="12" fill="#edf5ef" stroke="none" />
